[alembic]
script_location = alembic
prepend_sys_path = .
# Explicit separator for prepend_sys_path (Alembic 1.16+ deprecates the legacy default).
path_separator = os
# The URL is injected from Settings in alembic/env.py so there is exactly one
# source of truth for it. This line is intentionally left blank.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
