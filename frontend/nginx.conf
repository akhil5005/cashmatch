server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The UI is a single-page app: any unknown path is a client route,
    # not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin /api in production, so the browser never needs CORS.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Uploads can be a month of statements.
        client_max_body_size 20m;
    }
}
